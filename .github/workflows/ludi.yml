name: Verify Ludi

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build_image:
        description: Build a tested Docker image artifact for manual VPS release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ludi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run packages/games/src/ludi packages/games/src/runtime packages/games/src/catalog.test.ts packages/engine/src/state-machine.test.ts apps/web/server/utils/ludi-rooms.test.ts apps/web/server/utils/ludi-onda.test.ts packages/games/src/blocks/spectrum packages/games/src/blocks/ballpark apps/web/server/utils/ludi-client-ip.test.ts apps/web/app/utils/ludi-session.test.ts
      - run: pnpm typecheck
      - run: pnpm --filter @doot-games/web build
      - run: node scripts/verify-ludi.mjs
      - run: node scripts/verify-ludi.mjs --onda

  image:
    if: github.event_name == 'workflow_dispatch' && inputs.build_image
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Build immutable release image
        run: docker build -f docker/Dockerfile -t ludi:${{ github.sha }} .
      - name: Smoke test public image
        shell: bash
        run: |
          set -euo pipefail
          secret=$(openssl rand -hex 32)
          echo "::add-mask::$secret"
          docker run -d --name ludi-check -p 127.0.0.1:3300:3000 \
            -e SESSION_PASSWORD="$secret" -e LUDI_PUBLIC_ONLY=1 \
            -e NUXT_PUBLIC_LUDI_PUBLIC_ONLY=true \
            -e LUDI_PUBLIC_ORIGIN=http://127.0.0.1:3300 \
            -e DOOT_BACKUP_DISABLED=1 -e DOOT_EPHEMERAL_LIFECYCLE_DISABLED=1 \
            ludi:${{ github.sha }}
          trap 'docker rm -f ludi-check >/dev/null' EXIT
          ready=false
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:3300/api/health; then
              ready=true
              break
            fi
            echo "Waiting for image health ($attempt/40)"
            sleep 2
          done
          test "$ready" = true
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3300/api/admin/users)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3300/ludi)" = 200
          curl --fail --silent http://127.0.0.1:3300/api/ludi/rooms \
            -H 'Origin: http://127.0.0.1:3300' -H 'Content-Type: application/json' \
            --data '{"name":"Release check","id":"release-check-01"}' \
            | python3 -c 'import json,sys; assert json.load(sys.stdin)["code"]'
      - name: Export image
        run: docker save ludi:${{ github.sha }} | gzip > ludi-image.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ludi-image-${{ github.sha }}
          path: ludi-image.tar.gz
          compression-level: 0
          retention-days: 7
